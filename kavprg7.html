<html>
<body>
<head>
<style>
#text{
color:brown
}
</style>
</head>
<h1>change the HTML content</h1>
<h2 id="content">hello world</h2>
<button type="button" onclick='document.getElementById("content").innerHTML="MIT Mysore"'>click me </button>
<h3>change the HTML attributes</h3>
<img id="image" src="red.jpg" width="100" height="100"><br><br>
<button type="button" onclick='document.getElementById("image").src="pink.jpg"'>pink</button>
<button type="button" onclick='document.getElementById("image").src="yellow.jpg"'>yellow</button>
<button type="button" onclick='document.getElementById("image").src="blue.jpg"'>blue</button>
<h1>change the CSS</h1>
<h2 id="text">introduction to javascript</h2>
<button type="button" onclick='document.getElementById("text").style.color="green"'>color</button>
<h1> hide and display content</h1>
<h2 id="hidedisplay">ISE DEPT</h2>
<button type="button"
onclick='document.getElementById("hidedisplay").style.display="none"'>hide</button>
<button type="button"
onclick='document.getElementById("hidedisplay").style.display="block"'>display</button>
</body>
</html>
